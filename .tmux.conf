# Use default prefix Ctrl-b
set-option -g prefix C-b
bind-key C-b send-prefix

# Enable mouse support
set -g mouse on

# Set 256 color terminal
set -g default-terminal "screen-256color"
# true colour so hex colours render exactly instead of nearest-256 approximations
set -as terminal-features ",*:RGB"

# macOS red color theme (based on red close button #FF5F57)
set -g status-bg "#FF5F57"
set -g status-fg "#FFFFFF"
set -g status-style "bg=#FF5F57,fg=#FFFFFF"

# Status bar configuration
set -g status-left-length 20
set -g status-right-length 80
set -g status-left "#[bg=#E54B4B,fg=#FFFFFF,bold] #S #[bg=#FF5F57] "
set -g status-right "#(~/.tmux-spotify.sh) #[bg=#E54B4B,fg=#FFFFFF,bold] %H:%M %d-%b-%y "

# Window status
set -g window-status-current-style "bg=#000000,fg=#FFFFFF,bold"
set -g window-status-current-format " ▶ #I:#W "
# inactive windows blend into the bar so only the active one stands out
set -g window-status-style "bg=#FF5F57,fg=#FFD6D4"
set -g window-status-format " #I:#W "

# Pane borders
set -g pane-border-style "fg=#5A2A28"
set -g pane-active-border-style "fg=#FFFFFF,bold"
set -g pane-border-lines heavy
set -g pane-border-indicators arrows

# Message styling
set -g message-style "bg=#E54B4B,fg=#FFFFFF,bold"
set -g message-command-style "bg=#FF7F7A,fg=#FFFFFF"

# Copy mode colors
set -g mode-style "bg=#E54B4B,fg=#FFFFFF"

# Clock color
set -g clock-mode-colour "#E54B4B"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "bg=#FF5F57,fg=#FFFFFF,underscore"

# Split panes with more intuitive keys
bind | split-window -h
bind - split-window -v

# Easy config reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Vi-style key bindings
setw -g mode-keys vi

# Don't rename windows automatically
set-option -g allow-rename off